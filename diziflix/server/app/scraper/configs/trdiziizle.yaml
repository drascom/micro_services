display_name: TR Dizi Izle
site_id: trdiziizle
base_url: https://www.trdiziizle.tv
list_url: /dizi-arsivi-01/
fetch_mode: http
schema: MovieItem
playback: video
availability_gate:
  probe: 2
  require: player
collections:
- id: trending_trdiziizle
  title: Son Eklenen Diziler
  path: /tr2/
  role: trending
  row_selector: div#list-series-main
  fields:
    title:
      selector: .cat-container-main .cat-title-main a
    detail_url:
      selector: .cat-container-main .cat-title-main a
      attr: href
    year:
      selector: .cat-container-main .cat-title-main
      regex: ([0-9]{4})
      cast: int
    poster_url:
      fallback:
      - selector: img[data-src]
        attr: data-src
      - selector: img
        attr: src
- id: latest_series_trdiziizle
  title: Son Eklenen Diziler
  path: /tr2/
  role: latest_series
  row_selector: div#list-series-main
  fields:
    title:
      selector: .cat-container-main .cat-title-main a
    detail_url:
      selector: .cat-container-main .cat-title-main a
      attr: href
    year:
      selector: .cat-container-main .cat-title-main
      regex: ([0-9]{4})
      cast: int
    poster_url:
      fallback:
      - selector: img[data-src]
        attr: data-src
      - selector: img
        attr: src
- id: latest_episodes_trdiziizle
  title: Son Eklenen Bölümler
  path: /tr2/
  role: latest_episodes
  row_selector: div.listepisodes
  fields:
    title:
      selector: '.bolum-alt #dizi-ismi a'
    detail_url:
      selector: '.bolum-alt #dizi-ismi a'
      attr: href
    poster_url:
      fallback:
      - selector: img[alt='afis']
        attr: data-src
      - selector: img[alt='afis']
        attr: src
list:
  row_selector: div.single-item
  fields:
    title:
      selector: .cat-title a
    detail_url:
      selector: .cat-title a
      attr: href
    poster_url:
      fallback:
      - selector: img[data-src]
        attr: data-src
      - selector: img
        attr: src
detail:
  fields:
    title:
      selector: h1.title-border
    synopsis:
      selector: '#icerikcatright'
      regex: ^(.+?)(?=Yapım Yılı)
    year:
      selector: '#icerikcat2'
      regex: Yapım Yılı\s*:\s*([0-9]{4})
      cast: int
    cast:
      selector: '#icerikcat2'
      regex: Oyuncular\s*:\s*(.*?)(?=Tür\s*:|$)
      then_split: ','
    genres:
      selector: '#icerikcat2'
      regex: Tür\s*:\s*(.*)$
      then_split: ','
    rating:
      selector: span.imedebe
      regex: ([0-9]+(?:[.,][0-9]+)?)
      cast: float
normalize:
  host: www.trdiziizle.tv
  key:
    from:
    - detail_url
    regex: ^/(?:diziler/)?(?P<slug>.+?)(?:-son-bolum-izle(?:-[0-9]+)?|-izle(?:-[0-9]+)?|-[0-9]+-bolum(?:-full)?-izle(?:-[0-9]+)?|-[0-9]+-bolum-izle-full-tek-parca(?:-[0-9]+)?)?/?$
    template: '{slug}'
  type: series
resolvers:
- type: iframe
  selector: iframe[src*="/player/oynat/"]
  attr: src
providers:
- trdizi_player
series_page:
  row_selector: div.bolumust
  fields:
    url:
      selector: a[href*='-bolum']
      attr: href
    title:
      selector: .baslik
    air_date:
      selector: .tarih
      cast: date_tr
  episode_url_regex: ^/(?P<slug>[^/]+?)-(?P<episode>[0-9]+)-bolum(?:-[^/]*)?/?$
  series_url_regex: ^/diziler/
  series_slug_regex: ^/diziler/(?P<slug>.+?)(?:-son-bolum-izle(?:-[0-9]+)?|-izle(?:-[0-9]+)?)?/?$
  same_series_regex: ^/{slug}-[0-9]+-bolum
  default_season: 1
search:
  url: https://www.trdiziizle.tv/?s={query}
  row_selector: div.listepisodes
  fields:
    title:
      selector: '.bolum-alt #dizi-ismi a'
    detail_url:
      selector: '.bolum-alt #dizi-ismi a'
      attr: href
    poster_url:
      selector: img[alt='afis']
      attr: src
version: 1
updated_at: '2026-10-02T00:27:45Z'
