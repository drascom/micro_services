display_name: ddizi
site_id: ddizi
base_url: https://www.ddizi.im
list_url: /
fetch_mode: http
schema: MovieItem
playback: video
image_hosts:
- www.ddizi.im
list:
  row_selector: div.dizi-boxpost
  fields:
    title:
      selector: a
    detail_url:
      selector: a
      attr: href
    poster_url:
      fallback:
      - selector: img
        attr: data-src
      - selector: img
        attr: src
detail:
  fields:
    synopsis:
      selector: div.dizi_content
      regex: Özet:\s*(.*?)(?:Yayınlandı:|$)
    poster_url:
      selector: meta[property="og:image"]
      attr: content
resolvers:
- type: iframe
  selector: iframe[src*="/player/oynat/"]
  attr: src
providers:
- ddizi_player
normalize:
  host: www.ddizi.im
  key:
    from:
    - detail_url
    regex:
    - ^/izle/\d+/(?P<slug>[a-z0-9-]+?)-(?P<episode>\d+)-bolum[^/]*\.htm$
    - ^/diziler/\d+/(?P<slug>[a-z0-9-]+)-son-bolum-izle$
    template: '{slug}'
  type: series
  episode_source:
    enabled: true
    default_season: 1
series_page:
  row_selector: div.dizi-boxpost-cat, div.dizi-boxpost
  episode_url_regex: ^/izle/\d+/(?P<slug>[a-z0-9-]+?)-(?P<episode>\d+)-bolum
  default_season: 1
  same_series_regex: ^/izle/\d+/{slug}-\d+-bolum
collections:
- id: latest_episodes_ddizi
  title: Dizi izle
  path: /
  role: latest_episodes
  row_selector: div.dizi-boxpost
search:
  url: /arama/
  method: POST
  form:
    arama: '{query}'
  row_selector: div.dizi-boxpost-cat
  fields:
    title:
      selector: a
    detail_url:
      selector: a
      attr: href
    poster_url:
      selector: img
      attr: data-src
version: 1
updated_at: '2026-10-02T00:52:32Z'
