name: ddizi_player
description: Ddizi player pages with inline HLS or MP4 sources.
version: 1
match:
  host_regex: (^|\.)ddizi\.im$
  path_regex: ^/player/oynat/
fetch: http
referer: '{page_url}'
extract:
- regex: sources\s*:\s*\[\s*\{\s*file\s*:\s*\x22([^\x22]+)\x22
  type: auto
- regex: file\s*:\s*\x22([^\x22]+)\x22
  type: auto
updated_at: '2026-10-02T00:52:32Z'
