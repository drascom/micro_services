# Sürüm kataloğu: ince WebView kabuğu (Compose yok). AGP 8.5.2 (Gradle 8.7+, JDK 17) + Kotlin 1.9.24.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
webkit = "1.8.0"

[libraries]
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

[plugins]
