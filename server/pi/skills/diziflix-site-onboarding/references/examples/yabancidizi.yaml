playback: video
display_name: Yabancı Dizi
site_id: yabancidizi
fetch_mode: browser
obscura_stealth: true
obscura_settle_seconds: 1
cache_images: true
series_catalog: true
series_crawl:
  enabled: true
detail_prewarm_limit: 20
detail_prewarm_lists:
- latest_movies_yabancidizi
- noteworthy_movies_yabancidizi
item_limit: 60
# `collections:` follows the <role>_<site_id> convention (see references/collections.md); the `genre` role below is
# specific to this hand-built site, do not write it for a new one.
collections:
- id: genre_yabancidizi
  title: Yabancı Dizi
  path: /
  role: genre
  genre: yabancidizi
- id: latest_episodes_yabancidizi
  title: Yeni Eklenen Bölümler
  path: /
  role: latest_episodes
  required_fields:
  - season
  - episode
  excluded_fields:
  - featured
- id: trending_yabancidizi
  title: Trendler
  path: /trends
  role: trending
  row_selector: '#page-trending .weekly-trends .wt-column .item > a'
  sort_by: trend_score
  sort_desc: true
  fields:
    title:
      selector: h5
    detail_url:
      self: true
      attr: href
    poster_url:
      fallback:
      - selector: img[data-src]
        attr: data-src
      - selector: img[src]
        attr: src
    trend_score:
      selector: .description
      regex: (\d+)\s*puan
      cast: int
- id: latest_movies_yabancidizi
  title: En Son Filmler
  path: /film-izle-hd
  role: latest_movies
  row_selector: .latest-add-movies li.mofy-moviesli
- id: noteworthy_movies_yabancidizi
  title: Dikkate Değer Filmler
  path: /film-izle-hd/imdb-yuksek
  role: noteworthy_movies
  row_selector: .latest-add-movies li.mofy-moviesli
schema: HomepageItem
version: 9
updated_at: '2026-09-30T15:34:51Z'
base_url: https://yabancidizi.news
list_url: /
list:
  row_selector: '#router-view .featured-segment .poster-media, #router-view #latest_trailers
    > li, #router-view #result_lastEpisodes > li, #router-view .mofy-moviesli, #router-view
    .bigColumn, #router-view .new-tvseries > li'
  fields:
    featured:
      self: true
      attr: class
      regex: \bposter-media\b
    backdrop_url:
      selector: a > img[data-src*="/cover/"]
      attr: data-src
    title:
      fallback:
      - selector: h2, h6, .mofy-movbox-text a
      - selector: img
        attr: alt
    detail_url:
      selector: a[href]
      attr: href
    poster_url:
      fallback:
      - selector: img[data-src]
        attr: data-src
      - selector: img[src]
        attr: src
    rating:
      selector: .mofy-movpoint span, .item.rating
      cast: float
    year:
      selector: .mofy-movpoint p, .episode-no
      regex: \b(?:19|20)\d{2}\b
      cast: int
    genres:
      selector: .mofy-movbox-text p
      all: true
    season:
      selector: .episode-no, small
      regex: Sezon\s+(\d+)
      cast: int
    episode:
      selector: .episode-no
      regex: Bölüm\s+(\d+)
      cast: int
series_page:
  season_menu: '#seasons-menu a[href]'
  tab_selector: .season-list-column .ui.tab[data-season]
  tab_season_attr: data-season
  row_selector: .episodes-list .item
  unaired_classes:
  - not_yet
  fields:
    url:
      selector: a[href*='bolum-']
      attr: href
    title:
      selector: .table-episodes-title a
    air_date:
      selector: .episode-date
      cast: date_tr
  first_episode: '#first_episode'
  last_episode: '#last_episode'
